# ---------- Subscription ----------
SUBSCRIPTION_AUTOPAY.title=AutoPay ఆన్ అయింది
SUBSCRIPTION_AUTOPAY.body=ప్రతి నెలా ₹{price} ఆటోమేటిక్‌గా కట్ అవుతుంది. మీ UPI యాప్‌లో ఎప్పుడైనా ఆపవచ్చు.
SUBSCRIPTION_FAILED.title=పేమెంట్ జరగలేదు
SUBSCRIPTION_FAILED.body=ఈ నెల ₹{price} AutoPay ఫెయిల్ అయింది. మళ్లీ ప్రయత్నిస్తాం; మీ UPI యాప్ లేదా బ్యాంక్‌లో డబ్బు ఉందో, AutoPay ఆన్‌లో ఉందో చూసుకోండి.
SUBSCRIPTION_STOPPED.title=AutoPay ఆగిపోయింది
SUBSCRIPTION_STOPPED.body=మీ సెలూన్ AutoPay ఆగిపోయింది. ఇది {day} వరకు ఆన్‌లో ఉంటుంది; పేమెంట్ చేసి ఆన్‌లైన్ బుకింగ్‌లు తీసుకుంటూ ఉండటానికి Clozest తెరవండి.
SUBSCRIPTION_PAID.title=పేమెంట్ అందింది
SUBSCRIPTION_PAID.body=మీ సెలూన్ కోసం ₹{price} అందింది. {day} వరకు కట్టారు. కస్టమర్లు దీన్ని చూసి బుక్ చేయగలరు.
SUBSCRIPTION_ENDING.title=మీ {what} {day}న ముగుస్తుంది
SUBSCRIPTION_ENDING.body=కస్టమర్లు మిమ్మల్ని బుక్ చేస్తూ ఉండాలంటే Clozestలో AutoPay ({price}) సెట్ చేయండి. {day} ముందు ఏమీ కట్ అవ్వదు.
SUBSCRIPTION_ENDED.title=మీ {what} ముగిసింది
SUBSCRIPTION_ENDED.body={payBy} లోపు Clozestలో ₹{price} కట్టండి, లేదంటే తర్వాతి రోజు నుంచి కస్టమర్లకు మీ సెలూన్ కనిపించదు.
SUBSCRIPTION_ENDED_AUTOPAY.title=మీ AutoPay పేమెంట్ జరగలేదు
SUBSCRIPTION_ENDED_AUTOPAY.body={payBy} లోపు Clozestలో ₹{price} కట్టండి, లేదంటే తర్వాతి రోజు నుంచి కస్టమర్లకు మీ సెలూన్ కనిపించదు.
SUBSCRIPTION_HIDDEN.title=కస్టమర్లకు మీ సెలూన్ కనిపించడం లేదు
SUBSCRIPTION_HIDDEN.body=మీ సెలూన్ Clozestలో దాచి ఉంది, {price} కట్టే వరకు కొత్త ఆన్‌లైన్ బుకింగ్‌లు తీసుకోదు. ఇప్పటికే అయిన బుకింగ్‌లు అలాగే ఉంటాయి.

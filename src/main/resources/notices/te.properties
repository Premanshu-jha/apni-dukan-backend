# Telugu. Translated from en.properties (see there): same keys, every {blank} kept, digits 0-9, UTF-8.

# ---------- Bookings: to the customer ----------
BOOKING_CONFIRMED.title={salon}లో బుకింగ్ అయింది
BOOKING_CONFIRMED.body={salon}, {when}, {services}. బుకింగ్ {booking}. పేమెంట్ సెలూన్‌లో చేయండి.
BOOKING_RESCHEDULED.title=బుకింగ్ టైమ్ మారింది
BOOKING_RESCHEDULED.body={salon}, ఇప్పుడు {when}. బుకింగ్ {booking}.
BOOKING_CANCELLED.title=బుకింగ్ క్యాన్సిల్ అయింది
BOOKING_CANCELLED.body={salon}లో {when} మీ బుకింగ్ క్యాన్సిల్ అయింది.{late}
BOOKING_CANCELLED.late=\ ఇది 1 గంట కంటే తక్కువ ముందు జరిగింది, కాబట్టి లేట్ క్యాన్సిల్‌గా లెక్కిస్తాం.
BOOKING_CANCELLED_BY_SALON.title=సెలూన్ బుకింగ్ క్యాన్సిల్ చేసింది
BOOKING_CANCELLED_BY_SALON.body={salon} మీ {when} బుకింగ్‌ని క్యాన్సిల్ చేసింది: {reason}
BOOKING_NO_SHOW.title=బుకింగ్ మిస్ అయింది
BOOKING_NO_SHOW.body=మీరు {time}కి {salon}కి రాలేదు. దీన్ని నో-షోగా లెక్కిస్తాం; 60 రోజుల్లో 3 నో-షోలు అయితే 30 రోజులు ఆన్‌లైన్ బుకింగ్ ఆగిపోతుంది.
BOOKING_EARLIER_SLOT.title={salon}లో ముందు టైమ్ ఖాళీ అయింది
BOOKING_EARLIER_SLOT.body={when} {barber}తో టైమ్ ఖాళీ అయింది. మీ బుకింగ్ {time}కి ఉంది. బుకింగ్ ముందుకు మార్చడానికి ట్యాప్ చేయండి; ముందు మార్చినవారికి దొరుకుతుంది.
BOOKING_NO_SHOW_UNDONE.title=మిస్ అయిన బుకింగ్ తీసేశారు
BOOKING_NO_SHOW_UNDONE.body={when} మీరు నో-షో కాదని {salon} చెప్పింది. ఇది మీకు వ్యతిరేకంగా లెక్కలోకి రాదు.
BOOKING_BARBER_CHANGED.title=మీ బార్బర్ మారారు
BOOKING_BARBER_CHANGED.body={salon}, {when}: ఇప్పుడు {to}తో. బుకింగ్ {booking}.
BOOKING_REMINDER.title=1 గంటలో {salon}లో బుకింగ్
BOOKING_REMINDER.body={time}కి {salon}లో బుకింగ్. స్టార్ట్ కోడ్ {code}. {until} వరకు మీ కోసం ఆగుతాం. రాలేకపోతున్నారా? యాప్‌లో క్యాన్సిల్ చేయండి. {address}, {area}. మ్యాప్: {map}
BOOKING_RATE_VISIT.title=మీ విజిట్ ఎలా ఉంది?
BOOKING_RATE_VISIT.body={salon}లో మీ {services}కి రేటింగ్ ఇవ్వండి. ఇది ఇతరులు ఎంచుకోవడానికి సహాయపడుతుంది, సెలూన్‌కి ఏది బాగుందో తెలుస్తుంది.
BOOKING_COME_BACK.title=మీ తదుపరి {services}కి టైమ్ అయిందా?
BOOKING_COME_BACK.body={salon}లో మీ {services} అయి {ago} అయింది. కొన్ని ట్యాప్‌లలో తదుపరి బుకింగ్ చేయండి.
BOOKING_OFFER.title={salon}లో {percent}% తగ్గింపు
BOOKING_OFFER.body={what} · {when}. యాప్‌లో బుక్ చేయండి.

# ---------- Bookings: to the salon ----------
SALON_NEW_BOOKING.title=కొత్త బుకింగ్, {time}
SALON_NEW_BOOKING.body={who} {barber}తో {services} బుక్ చేశారు, {when}. బుకింగ్ {booking}.
SALON_BOOKING_MOVED.title=బుకింగ్ టైమ్ మారింది
SALON_BOOKING_MOVED.body={who} బుకింగ్ {booking}ని {from} నుంచి {to}కి మార్చారు, {barber}తో.
SALON_BOOKING_CANCELLED.title=బుకింగ్ క్యాన్సిల్, {time}
SALON_BOOKING_CANCELLED.body={who} {barber}తో {when} బుకింగ్ క్యాన్సిల్ చేశారు. బుకింగ్ {booking}.{note} ఈ టైమ్ మళ్లీ ఖాళీ.
SALON_BOOKING_CANCELLED.late=\ 1 గంట కంటే తక్కువ ముందు.
SALON_BOOKING_CANCELLED.deleted=\ వాళ్లు తమ అకౌంట్ డిలీట్ చేశారు.
SALON_BOOKING_REASSIGNED.title=బుకింగ్ {to}కి ఇచ్చారు, {time}
SALON_BOOKING_REASSIGNED.body={who}, {when}: ఇప్పుడు {from}కి బదులు {to}తో.
SALON_CANCELLED_BY_SALON.title=సెలూన్ బుకింగ్ క్యాన్సిల్ చేసింది, {time}
SALON_CANCELLED_BY_SALON.body={who}, {when}: సెలూన్ క్యాన్సిల్ చేసింది ({reason}). ఈ టైమ్ మళ్లీ ఖాళీ.
SALON_WALK_IN_CANCELLED.title=వాక్-ఇన్ క్యాన్సిల్, {time}
SALON_WALK_IN_CANCELLED.body={time}కి {barber}తో ఉన్న {guest} చెయిర్‌లో ఉండగానే క్యాన్సిల్ అయింది: {reason}
SALON_WALK_IN_CANCELLED_CHAIR.title=వాక్-ఇన్ క్యాన్సిల్, {time}
SALON_WALK_IN_CANCELLED_CHAIR.body={time}కి {guest} క్యాన్సిల్ అయింది: {reason}


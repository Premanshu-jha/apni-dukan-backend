# ---------- The shop and the field team ----------
SHOP_APPROVED.title=మీ షాప్ లైవ్ అయింది
SHOP_APPROVED.body={name} అప్రూవ్ అయింది. దగ్గర్లోని కస్టమర్లు ఇప్పుడు దీన్ని చూడగలరు.{trial}
SHOP_APPROVED.trial=\ మీ ఫ్రీ ట్రయల్ {day} వరకు ఉంది; తర్వాత నెలకు ₹{price}. ఇప్పుడు ఏమీ కట్టక్కర్లేదు.
SHOP_RECHECKED.title=మీ మార్పులు చెక్ అయ్యాయి
SHOP_RECHECKED.body=మా ఫీల్డ్ టీమ్ {name} మార్పులను చెక్ చేసింది. ఇంకేమీ చేయక్కర్లేదు.
SHOP_NOT_APPROVED.title=మీ షాప్‌లో ఒకటి సరిచేయాలి
SHOP_NOT_APPROVED.body={name} ఇంకా అప్రూవ్ కాలేదు: {reason} యాప్‌లో సరిచేసి మళ్లీ పంపండి.
SHOP_FIX_ASKED.title=దయచేసి మీ మార్పు సరిచేయండి
SHOP_FIX_ASKED.body=మా ఫీల్డ్ టీమ్ {name} మార్పులను చెక్ చేసింది: {reason} సెలూన్ ట్యాబ్ → సెలూన్ వివరాలు (లేదా ఫోటోలు, వీడియో)లో సరిచేయండి. మీ సెలూన్ లైవ్‌లోనే ఉంటుంది.
SHOP_ADDRESS_CHANGED.title=మీ అడ్రస్ మార్చాం
SHOP_ADDRESS_CHANGED.body=మా ఫీల్డ్ టీమ్ {name} అడ్రస్‌ని {address}గా మార్చింది. కస్టమర్లకు ఇప్పుడు కొత్త అడ్రస్ కనిపిస్తుంది.
SHOP_ADDRESS_APPROVED.title=మీ కొత్త అడ్రస్ అప్రూవ్ అయింది
SHOP_ADDRESS_APPROVED.body=మా ఫీల్డ్ టీమ్ {name} కొత్త అడ్రస్‌ని అప్రూవ్ చేసింది: {address}. కస్టమర్లకు ఇప్పుడు ఇదే కనిపిస్తుంది.
SHOP_ADDRESS_DECLINED.title=మీ కొత్త అడ్రస్ అప్రూవ్ కాలేదు
SHOP_ADDRESS_DECLINED.body=మా ఫీల్డ్ టీమ్ {name} కొత్త అడ్రస్‌ని అప్రూవ్ చేయలేదు: {reason} మీ అడ్రస్ ముందులాగే ఉంటుంది; సెలూన్ ట్యాబ్ → సెలూన్ వివరాలులో మళ్లీ అడగవచ్చు.
SHOP_SUSPENDED.title=మీ షాప్ యాప్ నుంచి తీసేశాం
SHOP_SUSPENDED.body={name} కస్టమర్లకు కనిపించకుండా దాచాం: {reason} సరిచేయడానికి Clozestని సంప్రదించండి.
SHOP_REINSTATED.title=మీ షాప్‌ని మళ్లీ చెక్ చేస్తాం
SHOP_REINSTATED.body={name} ఇప్పుడు సస్పెండ్‌లో లేదు. మా టీమ్ విజిట్ చేస్తుంది; అప్రూవ్ అయ్యాక లైవ్ అవుతుంది.
SHOP_DOCUMENT_REMOVED.title=ట్రేడ్ లైసెన్స్ తీసేశాం
SHOP_DOCUMENT_REMOVED.body={name} నుంచి {doc} తీసేశాం: {reason} {after}
doc.SHOPS_ESTABLISHMENT=షాప్స్ అండ్ ఎస్టాబ్లిష్‌మెంట్ సర్టిఫికెట్
doc.TRADE_LICENCE=ట్రేడ్ లైసెన్స్
doc.UDYAM=Udyam సర్టిఫికెట్
removed.afterApproved=మీ సెలూన్ బుకింగ్‌లకు తెరిచే ఉంటుంది. సరైనదాన్ని సెలూన్ → ట్రేడ్ లైసెన్స్‌లో యాడ్ చేయండి.
removed.afterDraft=సరైనదాన్ని మీ రిజిస్ట్రేషన్‌లో ఫోటోల దగ్గర యాడ్ చేయవచ్చు.
removed.afterOther=ఇంకేమీ మారదు. సరైనదాన్ని సెలూన్ → ట్రేడ్ లైసెన్స్‌లో యాడ్ చేయండి.
review.reasons={list}.{note}
reason.SHOP_FRONT_PHOTO=షాప్ ముందు ఫోటో స్పష్టంగా లేదు
reason.BOARD_NOT_VISIBLE=ఫోటోలో పేరు బోర్డు కనిపించడం లేదు
reason.INSIDE_PHOTOS=లోపలి ఫోటోలు లేవు లేదా స్పష్టంగా లేవు
reason.OWNER_NAME=ఓనర్ పేరు సరిపోలడం లేదు
reason.LICENCE_UNREADABLE=ట్రేడ్ లైసెన్స్ చదవడానికి రావడం లేదు
reason.LICENCE_NAME_MISMATCH=ట్రేడ్ లైసెన్స్‌పై పేరు సరిపోలడం లేదు
reason.LICENCE_EXPIRED=ట్రేడ్ లైసెన్స్ గడువు ముగిసింది
reason.LICENCE_WRONG_TYPE=ఇది సెలూన్ ట్రేడ్ లైసెన్స్ కాదు
reason.ADDRESS_WRONG=అడ్రస్ తప్పుగా ఉంది
reason.PIN_WRONG_PLACE=మ్యాప్‌లో పిన్ తప్పు చోట ఉంది
reason.SERVICES_MISSING=సర్వీసులు లేదా ధరలు లేవు
reason.HOURS_MISSING=తెరిచే టైమింగ్స్ లేవు
reason.VIDEO_UNCLEAR=సెలూన్ వీడియో స్పష్టంగా లేదు

# ---------- Trade licence ----------
SHOP_LICENCE_PASSED.title=ట్రేడ్ లైసెన్స్ చెక్ అయింది
SHOP_LICENCE_PASSED.body=ఇప్పుడు {day} వరకు కస్టమర్లకు మీ సెలూన్ మీద "లైసెన్స్ ఉంది" అని కనిపిస్తుంది.
SHOP_LICENCE_FAILED.title=ట్రేడ్ లైసెన్స్ అంగీకరించలేదు
SHOP_LICENCE_FAILED.body={why} ఏం చేయాలో చూడటానికి ట్రేడ్ లైసెన్స్ తెరవండి.
licence.UNREADABLE=దీన్ని చదవలేకపోయాం: పూర్తి లైసెన్స్ కనిపించేలా, మంచి వెలుతురులో స్పష్టమైన ఫోటో తీయండి.
licence.NOT_TRADE_LICENCE=ఇది మున్సిపల్ ట్రేడ్ లైసెన్స్ కాదు.
licence.LOOKS_EDITED=ఇది ఎడిట్ చేసినట్టు ఉంది: మీకు ఇచ్చినట్టే అప్‌లోడ్ చేయండి.
licence.NO_NUMBER=దీనిపై లైసెన్స్ నంబర్ దొరకలేదు.
licence.NOT_A_SALON_TRADE=ఇది వేరే బిజినెస్ లైసెన్స్, సెలూన్‌ది కాదు.
licence.NO_VALIDITY=ఇది ఎప్పటి వరకు చెల్లుతుందో దొరకలేదు.
licence.EXPIRED=దీని గడువు ముగిసింది: రిన్యూ చేసిన లైసెన్స్ యాడ్ చేయండి.
licence.NAME_MISMATCH=దీనిపై ఉన్న పేరు మీ సెలూన్ పేరుతో గానీ ఓనర్ పేరుతో గానీ సరిపోలడం లేదు.
licence.ADDRESS_MISMATCH=దీనిపై ఉన్న అడ్రస్ మీ సెలూన్ అడ్రస్‌తో సరిపోలడం లేదు.
licence.DUPLICATE=ఈ లైసెన్స్ ఇప్పటికే వేరే సెలూన్ వాడుతోంది. ఇది మీదే అయితే సపోర్ట్‌కి రాయండి.
licence.NOT_READ=దీన్ని చదవలేకపోయాం: ఇంకా స్పష్టమైన ఫోటో లేదా PDF పెట్టి చూడండి.

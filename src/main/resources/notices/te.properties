SHOP_HANDOVER_ACCEPTED.title=షాప్ అప్పగించారు
SHOP_HANDOVER_ACCEPTED.body={name} ఇప్పుడు మీరు ఎంచుకున్న వ్యక్తిది. మీరు ఇక ఇందులో లేరు.{autoPay}
SHOP_HANDOVER_ACCEPTED.autoPay=\ దీని కోసం మీ Clozest AutoPay ఆపేశాం: ఇక డబ్బు కట్ అవ్వదు.
SHOP_HANDOVER_DONE.title=షాప్ ఇప్పుడు మీది
SHOP_HANDOVER_DONE.body=Clozestలో {name} ఇప్పుడు మీది. దీని వివరాలు, ఫోటోలు చూసుకోండి.
SHOP_HANDOVER_DECLINED.title=అప్పగించడానికి ఒప్పుకోలేదు
SHOP_HANDOVER_DECLINED.body=మీరు అడిగిన వ్యక్తి {name} తీసుకోరు.
SHOP_INVITE.title={name}లో చేరడానికి ఆహ్వానం
SHOP_INVITE.body={name} ({area}) మిమ్మల్ని {role}గా చేరమని ఆహ్వానించింది. ఒప్పుకోవడానికి లేదా వద్దనడానికి Clozest తెరవండి.
SHOP_INVITE_ACCEPTED.title=ఆహ్వానం ఒప్పుకున్నారు
SHOP_INVITE_ACCEPTED.body={who} {name}లో {role}గా చేరారు.
SHOP_INVITE_DECLINED.title=ఆహ్వానం వద్దన్నారు
SHOP_INVITE_DECLINED.body={phone} నంబర్ వ్యక్తి {name}లో చేరరు.


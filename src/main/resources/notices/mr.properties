SALON_CANCELLED_BY_SALON.title=सलूनने बुकिंग रद्द केले, {time}
SALON_CANCELLED_BY_SALON.body={who}, {when}: सलूनने रद्द केले ({reason}). ही वेळ पुन्हा मोकळी आहे.
SALON_WALK_IN_CANCELLED.title=वॉक-इन रद्द, {time}
SALON_WALK_IN_CANCELLED.body={time} ला {barber} कडील {guest} खुर्चीत असतानाच रद्द झाले: {reason}
SALON_WALK_IN_CANCELLED_CHAIR.title=वॉक-इन रद्द, {time}
SALON_WALK_IN_CANCELLED_CHAIR.body={time} चे {guest} रद्द झाले: {reason}


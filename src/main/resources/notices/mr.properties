BOOKING_CANCELLED_BY_SALON.title=सलूनने बुकिंग रद्द केले
BOOKING_CANCELLED_BY_SALON.body={salon} ने तुमचे {when} चे बुकिंग रद्द केले: {reason}
BOOKING_NO_SHOW.title=बुकिंग चुकले
BOOKING_NO_SHOW.body=तुम्ही {time} ला {salon} मध्ये आला नाहीत. हे नो-शो मानले आहे; 60 दिवसांत 3 नो-शो झाले तर 30 दिवस ऑनलाइन बुकिंग बंद राहते.
BOOKING_EARLIER_SLOT.title={salon} मध्ये आधीची वेळ मोकळी झाली
BOOKING_EARLIER_SLOT.body={when} ला {barber} कडे वेळ मोकळी झाली आहे. तुमचे बुकिंग {time} चे आहे. बुकिंग आधी करण्यासाठी टॅप करा; जो आधी बदलेल त्याला मिळेल.
BOOKING_NO_SHOW_UNDONE.title=चुकलेले बुकिंग काढले
BOOKING_NO_SHOW_UNDONE.body={salon} ने सांगितले की {when} ला तुम्ही नो-शो नव्हता. हे तुमच्या विरोधात मोजले जाणार नाही.
BOOKING_BARBER_CHANGED.title=तुमचा बार्बर बदलला
BOOKING_BARBER_CHANGED.body={salon}, {when}: आता {to} कडे. बुकिंग {booking}.
BOOKING_REMINDER.title=1 तासात {salon} मध्ये बुकिंग
BOOKING_REMINDER.body={time} ला {salon} मध्ये बुकिंग. स्टार्ट कोड {code}. {until} पर्यंत तुमची वाट पाहू. येऊ शकत नाही? ॲपमध्ये रद्द करा. {address}, {area}. मॅप: {map}
BOOKING_RATE_VISIT.title=तुमची भेट कशी होती?
BOOKING_RATE_VISIT.body={salon} मधील तुमच्या {services} ला रेटिंग द्या. यामुळे इतरांना निवडायला मदत होते, आणि सलूनला काय चांगले झाले ते कळते.
BOOKING_COME_BACK.title=पुढच्या {services} ची वेळ झाली?
BOOKING_COME_BACK.body={salon} मधील तुमच्या {services} ला {ago} झाले. काही टॅपमध्ये पुढचे बुकिंग करा.
BOOKING_OFFER.title={salon} मध्ये {percent}% सूट
BOOKING_OFFER.body={what} · {when}. ॲपमध्ये बुक करा.


# Marathi. Translated from en.properties (see there): same keys, every {blank} kept, digits 0-9, UTF-8.

# ---------- Bookings: to the customer ----------
BOOKING_CONFIRMED.title={salon} मध्ये बुकिंग झाले
BOOKING_CONFIRMED.body={salon}, {when}, {services}. बुकिंग {booking}. पैसे सलूनमध्ये द्या.
BOOKING_RESCHEDULED.title=बुकिंगची वेळ बदलली
BOOKING_RESCHEDULED.body={salon}, आता {when}. बुकिंग {booking}.
BOOKING_CANCELLED.title=बुकिंग रद्द झाले
BOOKING_CANCELLED.body={salon} मधील {when} चे तुमचे बुकिंग रद्द झाले आहे.{late}

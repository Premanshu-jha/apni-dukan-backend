# Tamil. Translated from en.properties (see there): same keys, every {blank} kept, digits 0-9, UTF-8.

# ---------- Bookings: to the customer ----------
BOOKING_CONFIRMED.title={salon}-இல் புக்கிங் ஆனது
BOOKING_CONFIRMED.body={salon}, {when}, {services}. புக்கிங் {booking}. பணத்தை சலூனில் கட்டுங்கள்.
BOOKING_RESCHEDULED.title=புக்கிங் நேரம் மாறியது
BOOKING_RESCHEDULED.body={salon}, இப்போது {when}. புக்கிங் {booking}.
BOOKING_CANCELLED.title=புக்கிங் ரத்தானது
BOOKING_CANCELLED.body={salon}-இல் {when} உங்கள் புக்கிங் ரத்தானது.{late}
BOOKING_CANCELLED.late=\ இது 1 மணி நேரத்துக்குக் குறைவான முன்பு நடந்ததால், தாமதமான ரத்தாகக் கணக்கிடப்படும்.
BOOKING_CANCELLED_BY_SALON.title=சலூன் புக்கிங்கை ரத்து செய்தது
BOOKING_CANCELLED_BY_SALON.body={salon} உங்கள் {when} புக்கிங்கை ரத்து செய்தது: {reason}
BOOKING_NO_SHOW.title=புக்கிங் தவறியது
BOOKING_NO_SHOW.body=நீங்கள் {time}-க்கு {salon}-க்கு வரவில்லை. இது நோ-ஷோவாகக் கணக்கிடப்படும்; 60 நாட்களில் 3 நோ-ஷோ ஆனால் 30 நாட்களுக்கு ஆன்லைன் புக்கிங் நிறுத்தப்படும்.
BOOKING_EARLIER_SLOT.title={salon}-இல் முன்னதான நேரம் காலியானது
BOOKING_EARLIER_SLOT.body={when} {barber} உடன் நேரம் காலியாகியுள்ளது. உங்கள் புக்கிங் {time}-க்கு. புக்கிங்கை முன்னதாக மாற்ற டேப் செய்யுங்கள்; முதலில் மாற்றுபவருக்குக் கிடைக்கும்.
BOOKING_NO_SHOW_UNDONE.title=தவறிய புக்கிங் நீக்கப்பட்டது
BOOKING_NO_SHOW_UNDONE.body={when} நீங்கள் நோ-ஷோ இல்லை என்று {salon} சொன்னது. இது உங்களுக்கு எதிராகக் கணக்கிடப்படாது.
BOOKING_BARBER_CHANGED.title=உங்கள் பார்பர் மாறினார்
BOOKING_BARBER_CHANGED.body={salon}, {when}: இப்போது {to} உடன். புக்கிங் {booking}.
BOOKING_REMINDER.title=1 மணி நேரத்தில் {salon}-இல் புக்கிங்
BOOKING_REMINDER.body={time}-க்கு {salon}-இல் புக்கிங். ஸ்டார்ட் கோட் {code}. {until} வரை உங்களுக்காகக் காத்திருப்போம். வர முடியவில்லையா? ஆப்பில் ரத்து செய்யுங்கள். {address}, {area}. மேப்: {map}
BOOKING_RATE_VISIT.title=உங்கள் வருகை எப்படி இருந்தது?
BOOKING_RATE_VISIT.body={salon}-இல் உங்கள் {services}-க்கு ரேட்டிங் கொடுங்கள். இது மற்றவர்கள் தேர்வு செய்ய உதவும், சலூனுக்கு எது நன்றாக இருந்தது என்றும் தெரியும்.
BOOKING_COME_BACK.title=அடுத்த {services}-க்கு நேரம் ஆகிவிட்டதா?
BOOKING_COME_BACK.body={salon}-இல் உங்கள் {services} முடிந்து {ago} ஆகிவிட்டது. சில டேப்களில் அடுத்த புக்கிங் செய்யுங்கள்.
BOOKING_OFFER.title={salon}-இல் {percent}% தள்ளுபடி
BOOKING_OFFER.body={what} · {when}. ஆப்பில் புக் செய்யுங்கள்.

# ---------- Bookings: to the salon ----------
SALON_NEW_BOOKING.title=புதிய புக்கிங், {time}
SALON_NEW_BOOKING.body={who} {barber} உடன் {services} புக் செய்தார், {when}. புக்கிங் {booking}.
SALON_BOOKING_MOVED.title=புக்கிங் நேரம் மாறியது
SALON_BOOKING_MOVED.body={who} புக்கிங் {booking}-ஐ {from}-இலிருந்து {to}-க்கு மாற்றினார், {barber} உடன்.
SALON_BOOKING_CANCELLED.title=புக்கிங் ரத்து, {time}
SALON_BOOKING_CANCELLED.body={who} {barber} உடனான {when} புக்கிங்கை ரத்து செய்தார். புக்கிங் {booking}.{note} இந்த நேரம் மீண்டும் காலி.
SALON_BOOKING_CANCELLED.late=\ 1 மணி நேரத்துக்குக் குறைவான முன்பு.
SALON_BOOKING_CANCELLED.deleted=\ அவர் தன் அக்கவுண்ட்டை டெலீட் செய்துவிட்டார்.
SALON_BOOKING_REASSIGNED.title=புக்கிங் {to}-க்கு மாற்றப்பட்டது, {time}
SALON_BOOKING_REASSIGNED.body={who}, {when}: இப்போது {from}-க்குப் பதில் {to} உடன்.
SALON_CANCELLED_BY_SALON.title=சலூன் புக்கிங்கை ரத்து செய்தது, {time}
SALON_CANCELLED_BY_SALON.body={who}, {when}: சலூன் ரத்து செய்தது ({reason}). இந்த நேரம் மீண்டும் காலி.
SALON_WALK_IN_CANCELLED.title=வாக்-இன் ரத்து, {time}
SALON_WALK_IN_CANCELLED.body={time}-க்கு {barber} உடன் இருந்த {guest} சேரில் இருக்கும்போதே ரத்தானது: {reason}
SALON_WALK_IN_CANCELLED_CHAIR.title=வாக்-இன் ரத்து, {time}
SALON_WALK_IN_CANCELLED_CHAIR.body={time}-க்கு {guest} ரத்தானது: {reason}


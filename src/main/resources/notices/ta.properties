# ---------- The shop and the field team ----------
SHOP_APPROVED.title=உங்கள் கடை லைவ் ஆனது
SHOP_APPROVED.body={name} அப்ரூவ் ஆனது. அருகிலுள்ள கஸ்டமர்கள் இப்போது இதைப் பார்க்கலாம்.{trial}
SHOP_APPROVED.trial=\ உங்கள் இலவச ட்ரையல் {day} வரை; அதன் பிறகு மாதம் ₹{price}. இப்போது எதுவும் கட்ட வேண்டாம்.
SHOP_RECHECKED.title=உங்கள் மாற்றங்கள் சரிபார்க்கப்பட்டன
SHOP_RECHECKED.body=எங்கள் ஃபீல்டு டீம் {name}-இன் மாற்றங்களைச் சரிபார்த்தது. வேறு எதுவும் செய்ய வேண்டாம்.
SHOP_NOT_APPROVED.title=உங்கள் கடையில் ஒன்றைச் சரிசெய்ய வேண்டும்
SHOP_NOT_APPROVED.body={name} இன்னும் அப்ரூவ் ஆகவில்லை: {reason} ஆப்பில் சரிசெய்து மீண்டும் அனுப்புங்கள்.
SHOP_FIX_ASKED.title=உங்கள் மாற்றத்தைச் சரிசெய்யுங்கள்
SHOP_FIX_ASKED.body=எங்கள் ஃபீல்டு டீம் {name}-இன் மாற்றங்களைச் சரிபார்த்தது: {reason} சலூன் டேப் → சலூன் விவரங்கள் (அல்லது ஃபோட்டோக்கள் மற்றும் வீடியோ)-இல் சரிசெய்யுங்கள். உங்கள் சலூன் லைவ்வாகவே இருக்கும்.
SHOP_ADDRESS_CHANGED.title=உங்கள் முகவரி மாற்றப்பட்டது
SHOP_ADDRESS_CHANGED.body=எங்கள் ஃபீல்டு டீம் {name}-இன் முகவரியை {address} என மாற்றியது. கஸ்டமர்களுக்கு இப்போது புதிய முகவரி தெரியும்.
SHOP_ADDRESS_APPROVED.title=உங்கள் புதிய முகவரி அப்ரூவ் ஆனது
SHOP_ADDRESS_APPROVED.body=எங்கள் ஃபீல்டு டீம் {name}-இன் புதிய முகவரியை அப்ரூவ் செய்தது: {address}. கஸ்டமர்களுக்கு இப்போது இதுவே தெரியும்.
SHOP_ADDRESS_DECLINED.title=உங்கள் புதிய முகவரி அப்ரூவ் ஆகவில்லை
SHOP_ADDRESS_DECLINED.body=எங்கள் ஃபீல்டு டீம் {name}-இன் புதிய முகவரியை அப்ரூவ் செய்யவில்லை: {reason} உங்கள் முகவரி முன்பு போலவே இருக்கும்; சலூன் டேப் → சலூன் விவரங்கள்-இல் மீண்டும் கேட்கலாம்.
SHOP_SUSPENDED.title=உங்கள் கடை ஆப்பிலிருந்து நீக்கப்பட்டது
SHOP_SUSPENDED.body={name} கஸ்டமர்களுக்குத் தெரியாமல் மறைக்கப்பட்டுள்ளது: {reason} இதைச் சரிசெய்ய Clozest-ஐத் தொடர்புகொள்ளுங்கள்.
SHOP_REINSTATED.title=உங்கள் கடை மீண்டும் சரிபார்க்கப்படும்
SHOP_REINSTATED.body={name} இப்போது சஸ்பெண்டில் இல்லை. எங்கள் டீம் வந்து பார்க்கும்; அப்ரூவ் ஆனதும் லைவ் ஆகும்.
SHOP_DOCUMENT_REMOVED.title=டிரேட் லைசென்ஸ் நீக்கப்பட்டது
SHOP_DOCUMENT_REMOVED.body={name}-இலிருந்து {doc}-ஐ நீக்கினோம்: {reason} {after}
doc.SHOPS_ESTABLISHMENT=ஷாப்ஸ் அண்ட் எஸ்டாப்ளிஷ்மென்ட் சர்டிபிகேட்
doc.TRADE_LICENCE=டிரேட் லைசென்ஸ்
doc.UDYAM=Udyam சர்டிபிகேட்
removed.afterApproved=உங்கள் சலூன் புக்கிங்கிற்குத் திறந்தே இருக்கும். சரியானதை சலூன் → டிரேட் லைசென்ஸ்-இல் சேருங்கள்.
removed.afterDraft=சரியானதை உங்கள் ரெஜிஸ்ட்ரேஷனில், ஃபோட்டோக்கள் பகுதியில் சேர்க்கலாம்.
removed.afterOther=வேறு எதுவும் மாறாது. சரியானதை சலூன் → டிரேட் லைசென்ஸ்-இல் சேருங்கள்.
review.reasons={list}.{note}
reason.SHOP_FRONT_PHOTO=கடையின் முன்பக்க ஃபோட்டோ தெளிவாக இல்லை
reason.BOARD_NOT_VISIBLE=ஃபோட்டோவில் பெயர்ப் பலகை தெரியவில்லை
reason.INSIDE_PHOTOS=உள்ளே எடுத்த ஃபோட்டோக்கள் இல்லை அல்லது தெளிவாக இல்லை
reason.OWNER_NAME=உரிமையாளரின் பெயர் பொருந்தவில்லை
reason.LICENCE_UNREADABLE=டிரேட் லைசென்ஸைப் படிக்க முடியவில்லை
reason.LICENCE_NAME_MISMATCH=டிரேட் லைசென்ஸில் உள்ள பெயர் பொருந்தவில்லை
reason.LICENCE_EXPIRED=டிரேட் லைசென்ஸின் காலம் முடிந்துவிட்டது
reason.LICENCE_WRONG_TYPE=இது சலூனுக்கான டிரேட் லைசென்ஸ் இல்லை
reason.ADDRESS_WRONG=முகவரி தவறாக உள்ளது
reason.PIN_WRONG_PLACE=மேப்பில் பின் தவறான இடத்தில் உள்ளது
reason.SERVICES_MISSING=சர்வீஸ்கள் அல்லது விலைகள் இல்லை
reason.HOURS_MISSING=திறந்திருக்கும் நேரம் இல்லை
reason.VIDEO_UNCLEAR=சலூன் வீடியோ தெளிவாக இல்லை

# ---------- Trade licence ----------
SHOP_LICENCE_PASSED.title=டிரேட் லைசென்ஸ் சரிபார்க்கப்பட்டது
SHOP_LICENCE_PASSED.body=இப்போது {day} வரை கஸ்டமர்களுக்கு உங்கள் சலூனில் "லைசென்ஸ் உள்ளது" என்று தெரியும்.
SHOP_LICENCE_FAILED.title=டிரேட் லைசென்ஸ் ஏற்கப்படவில்லை
SHOP_LICENCE_FAILED.body={why} என்ன செய்ய வேண்டும் என்று பார்க்க டிரேட் லைசென்ஸைத் திறங்கள்.
licence.UNREADABLE=இதைப் படிக்க முடியவில்லை: முழு லைசென்ஸும் தெரியும்படி, நல்ல வெளிச்சத்தில் தெளிவான ஃபோட்டோ எடுங்கள்.
licence.NOT_TRADE_LICENCE=இது நகராட்சி டிரேட் லைசென்ஸ் இல்லை.
licence.LOOKS_EDITED=இது எடிட் செய்யப்பட்டது போல் தெரிகிறது: கிடைத்தபடியே அப்லோட் செய்யுங்கள்.
licence.NO_NUMBER=இதில் லைசென்ஸ் நம்பர் கிடைக்கவில்லை.
licence.NOT_A_SALON_TRADE=இது வேறு தொழிலுக்கான லைசென்ஸ், சலூனுக்கானது இல்லை.
licence.NO_VALIDITY=இது எப்போது வரை செல்லும் என்று கிடைக்கவில்லை.
licence.EXPIRED=இதன் காலம் முடிந்துவிட்டது: புதுப்பித்த லைசென்ஸைச் சேருங்கள்.
licence.NAME_MISMATCH=இதில் உள்ள பெயர் உங்கள் சலூன் பெயருடனோ உரிமையாளர் பெயருடனோ பொருந்தவில்லை.
licence.ADDRESS_MISMATCH=இதில் உள்ள முகவரி உங்கள் சலூன் முகவரியுடன் பொருந்தவில்லை.
licence.DUPLICATE=இந்த லைசென்ஸை ஏற்கனவே வேறு சலூன் பயன்படுத்துகிறது. இது உங்களுடையது என்றால் சப்போர்ட்டுக்கு எழுதுங்கள்.
licence.NOT_READ=இதைப் படிக்க முடியவில்லை: இன்னும் தெளிவான ஃபோட்டோ அல்லது PDF போட்டுப் பாருங்கள்.
licence.NOT_A_SHOP_TRADE=இது வேறு தொழிலுக்கானது, மளிகை அல்லது ஜெனரல் ஸ்டோருக்கானது இல்லை.
licence.NOT_SHOPS_ESTABLISHMENT=இது ஷாப்ஸ் அண்ட் எஸ்டாப்ளிஷ்மென்ட் சர்டிபிகேட் இல்லை.
SHOP_LICENCE_EXPIRED.title=டிரேட் லைசென்ஸின் காலம் முடிந்தது
SHOP_LICENCE_EXPIRED.body=உங்கள் டிரேட் லைசென்ஸின் காலம் {day} அன்று முடிந்தது: கஸ்டமர்களுக்கு இனி "லைசென்ஸ் உள்ளது" தெரியாது. மீண்டும் காட்ட புதுப்பித்த லைசென்ஸை அப்லோட் செய்யுங்கள்.
SHOP_LICENCE_EXPIRING.title=டிரேட் லைசென்ஸ் விரைவில் முடியும்
SHOP_LICENCE_EXPIRING.body=உங்கள் டிரேட் லைசென்ஸ் {day} வரை செல்லும். உங்கள் சலூனில் "லைசென்ஸ் உள்ளது" தொடர, அதற்கு முன் புதுப்பித்த லைசென்ஸை அப்லோட் செய்யுங்கள்.

# ---------- Subscription ----------
SUBSCRIPTION_AUTOPAY.title=AutoPay ஆன் ஆனது
SUBSCRIPTION_AUTOPAY.body=ஒவ்வொரு மாதமும் ₹{price} தானாகக் கட்டப்படும். உங்கள் UPI ஆப்பில் எப்போது வேண்டுமானாலும் நிறுத்தலாம்.
SUBSCRIPTION_FAILED.title=பேமெண்ட் போகவில்லை
SUBSCRIPTION_FAILED.body=இந்த மாத ₹{price} AutoPay தோல்வியடைந்தது. மீண்டும் முயற்சிக்கப்படும்; உங்கள் UPI ஆப் அல்லது பேங்கில் பணம் இருக்கிறதா, AutoPay ஆனில் இருக்கிறதா என்று பாருங்கள்.
SUBSCRIPTION_STOPPED.title=AutoPay நின்றது
SUBSCRIPTION_STOPPED.body=உங்கள் சலூனின் AutoPay நின்றுவிட்டது. இது {day} வரை தொடரும்; பணம் கட்டி ஆன்லைன் புக்கிங் எடுத்துக்கொண்டே இருக்க Clozest-ஐத் திறங்கள்.
SUBSCRIPTION_PAID.title=பேமெண்ட் கிடைத்தது
SUBSCRIPTION_PAID.body=உங்கள் சலூனுக்கு ₹{price} கிடைத்தது. {day} வரை கட்டப்பட்டுள்ளது. கஸ்டமர்கள் இதைப் பார்த்து புக் செய்யலாம்.
SUBSCRIPTION_ENDING.title=உங்கள் {what} {day} அன்று முடியும்
SUBSCRIPTION_ENDING.body=கஸ்டமர்கள் உங்களைத் தொடர்ந்து புக் செய்ய, Clozest-இல் AutoPay ({price}) அமையுங்கள். {day}-க்கு முன் எதுவும் எடுக்கப்படாது.
SUBSCRIPTION_ENDED.title=உங்கள் {what} முடிந்தது
SUBSCRIPTION_ENDED.body={payBy}-க்குள் Clozest-இல் ₹{price} கட்டுங்கள், இல்லையென்றால் அடுத்த நாளிலிருந்து கஸ்டமர்களுக்கு உங்கள் சலூன் தெரியாது.
SUBSCRIPTION_ENDED_AUTOPAY.title=உங்கள் AutoPay பேமெண்ட் போகவில்லை
SUBSCRIPTION_ENDED_AUTOPAY.body={payBy}-க்குள் Clozest-இல் ₹{price} கட்டுங்கள், இல்லையென்றால் அடுத்த நாளிலிருந்து கஸ்டமர்களுக்கு உங்கள் சலூன் தெரியாது.
SUBSCRIPTION_HIDDEN.title=கஸ்டமர்களுக்கு உங்கள் சலூன் தெரியவில்லை
SUBSCRIPTION_HIDDEN.body=உங்கள் சலூன் Clozest-இல் மறைக்கப்பட்டுள்ளது, {price} கட்டும் வரை புதிய ஆன்லைன் புக்கிங் எடுக்காது. ஏற்கனவே ஆன புக்கிங்குகள் அப்படியே இருக்கும்.
sub.freeTrial=இலவச ட்ரையல்
sub.paidMonth=கட்டிய மாதம்
sub.pricePerMonth=மாதம் ₹{price}

# ---------- Hand-over and team invitations ----------
SHOP_HANDOVER_REQUEST.title=உங்களுக்கு ஒரு கடை
SHOP_HANDOVER_REQUEST.body={name}-இன் உரிமையாளர் இந்தக் கடையை உங்களிடம் ஒப்படைக்க விரும்புகிறார். ஏற்க அல்லது மறுக்க Clozest-ஐத் திறங்கள்.
SHOP_HANDOVER_ACCEPTED.title=கடை ஒப்படைக்கப்பட்டது
SHOP_HANDOVER_ACCEPTED.body={name} இப்போது நீங்கள் தேர்ந்தெடுத்தவருடையது. நீங்கள் இனி இதில் இல்லை.{autoPay}
SHOP_HANDOVER_ACCEPTED.autoPay=\ இதற்கான உங்கள் Clozest AutoPay நிறுத்தப்பட்டது: இனி பணம் எடுக்கப்படாது.
SHOP_HANDOVER_DONE.title=கடை இப்போது உங்களுடையது
SHOP_HANDOVER_DONE.body=Clozest-இல் {name} இப்போது உங்களுடையது. இதன் விவரங்களையும் ஃபோட்டோக்களையும் பாருங்கள்.
SHOP_HANDOVER_DECLINED.title=ஒப்படைப்பு மறுக்கப்பட்டது
SHOP_HANDOVER_DECLINED.body=நீங்கள் கேட்டவர் {name}-ஐ ஏற்க மாட்டார்.
SHOP_INVITE.title={name}-இல் சேர அழைப்பு
SHOP_INVITE.body={name} ({area}) உங்களை {role} ஆகச் சேர அழைத்துள்ளது. ஏற்க அல்லது மறுக்க Clozest-ஐத் திறங்கள்.
SHOP_INVITE_ACCEPTED.title=அழைப்பு ஏற்கப்பட்டது
SHOP_INVITE_ACCEPTED.body={who} {name}-இல் {role} ஆகச் சேர்ந்தார்.
SHOP_INVITE_DECLINED.title=அழைப்பு மறுக்கப்பட்டது
SHOP_INVITE_DECLINED.body={phone} நம்பர் உள்ளவர் {name}-இல் சேர மாட்டார்.

# ---------- Help ----------
HELP_REPLIED.title={ticket}-க்கு சப்போர்ட் பதில் அளித்தது
HELP_REPLIED.body=உங்கள் கேள்விக்குப் பதில் அளித்துள்ளோம். படிக்க டேப் செய்யுங்கள்.
HELP_RESOLVED.title=சப்போர்ட் {ticket}-ஐத் தீர்த்தது
HELP_RESOLVED.body=உங்கள் கேள்விக்குப் பதில் கொடுத்துவிட்டோம். படிக்க டேப் செய்யுங்கள்.

# ---------- Help emails (TicketEmails) ----------
email.ticket.ackSubject=உங்கள் கோரிக்கை எங்களுக்குக் கிடைத்தது
email.ticket.hi=வணக்கம்,
email.ticket.hiName=வணக்கம் {name},
email.ticket.ack=Clozest சப்போர்ட்டுக்கு உங்கள் கோரிக்கை கிடைத்தது, டிக்கெட் {ticket} உருவாக்கியுள்ளோம். எங்கள் சப்போர்ட் டீம் முடிந்தவரை சீக்கிரம், பொதுவாக ஒரு வேலை நாளுக்குள், உங்களுக்குப் பதில் அளிக்கும்.
email.ticket.yourMessage=உங்கள் மெசேஜ்:
email.ticket.addMore=ஏதாவது சேர்க்க வேண்டுமென்றால் (ஃபோட்டோ அல்லது ஸ்கிரீன்ஷாட்டும்), இந்த ஈமெயிலுக்கு ரிப்ளை செய்யுங்கள் (சப்ஜெக்டில் {ticket} அப்படியே இருக்கட்டும்).
email.ticket.signature=Clozest சப்போர்ட்
email.ticket.signedBy={name}, Clozest சப்போர்ட்
email.ticket.resolved=டிக்கெட் {ticket}-ஐத் தீர்ந்ததாகக் குறித்துள்ளோம். இன்னும் உதவி தேவைப்பட்டால், இந்த ஈமெயிலுக்கு ரிப்ளை செய்யுங்கள், அது மீண்டும் திறக்கும்.
email.ticket.replyMore=ஏதாவது சேர்க்க வேண்டுமென்றால் இந்த ஈமெயிலுக்கு ரிப்ளை செய்யுங்கள்.
email.ticket.youWrote=நீங்கள் எழுதியது:
email.ticket.yourRequest=உங்கள் கோரிக்கை
email.ticket.files.one=(இந்தப் பதிலுடன் {count} ஃபைல் அனுப்பியுள்ளோம். Clozest ஆப்பில் பாருங்கள்: உதவி வேண்டுமா, பிறகு என் கோரிக்கைகள்.)
email.ticket.files.other=(இந்தப் பதிலுடன் {count} ஃபைல்கள் அனுப்பியுள்ளோம். Clozest ஆப்பில் பாருங்கள்: உதவி வேண்டுமா, பிறகு என் கோரிக்கைகள்.)

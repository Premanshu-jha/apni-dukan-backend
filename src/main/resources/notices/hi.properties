SALON_BOOKING_REASSIGNED.title=बुकिंग {to} को दी गई, {time}
SALON_BOOKING_REASSIGNED.body={who}, {when}: अब {from} की जगह {to} के साथ।
SALON_CANCELLED_BY_SALON.title=सैलून ने बुकिंग कैंसल की, {time}
SALON_CANCELLED_BY_SALON.body={who}, {when}: सैलून ने कैंसल की ({reason})। यह समय फिर से खाली है।
SALON_WALK_IN_CANCELLED.title=वॉक-इन कैंसल, {time}
SALON_WALK_IN_CANCELLED.body={time} पर {barber} के साथ {guest} कुर्सी पर रहते हुए कैंसल हुआ: {reason}
SALON_WALK_IN_CANCELLED_CHAIR.title=वॉक-इन कैंसल, {time}
SALON_WALK_IN_CANCELLED_CHAIR.body={time} पर {guest} कैंसल हुआ: {reason}


SUBSCRIPTION_ENDING.title=आपका {what} {day} को ख़त्म होगा
SUBSCRIPTION_ENDING.body=Clozest में AutoPay ({price}) चालू करें, ताकि ग्राहक आपको बुक करते रहें। {day} से पहले कुछ नहीं कटेगा।

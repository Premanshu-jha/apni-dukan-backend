# Hindi. Translated from en.properties (see there): same keys, every {blank} kept, digits 0-9, UTF-8.

# ---------- Bookings: to the customer ----------
BOOKING_CONFIRMED.title={salon} में बुकिंग हो गई
BOOKING_CONFIRMED.body={salon}, {when}, {services}। बुकिंग {booking}। पेमेंट सैलून में करें।
BOOKING_RESCHEDULED.title=बुकिंग का समय बदला
BOOKING_RESCHEDULED.body={salon}, अब {when}। बुकिंग {booking}।
BOOKING_CANCELLED.title=बुकिंग कैंसल हुई
BOOKING_CANCELLED.body={salon} में {when} की आपकी बुकिंग कैंसल हो गई है।{late}
BOOKING_CANCELLED.late=\ यह 1 घंटे से कम पहले हुआ, इसलिए इसे लेट कैंसल गिना जाएगा।
BOOKING_CANCELLED_BY_SALON.title=सैलून ने बुकिंग कैंसल की
BOOKING_CANCELLED_BY_SALON.body={salon} ने {when} की आपकी बुकिंग कैंसल की: {reason}
BOOKING_NO_SHOW.title=बुकिंग छूट गई
BOOKING_NO_SHOW.body=आप {time} पर {salon} नहीं आए। इसे नो-शो गिना गया है; 60 दिन में 3 नो-शो होने पर 30 दिन के लिए ऑनलाइन बुकिंग रुक जाती है।
BOOKING_EARLIER_SLOT.title={salon} में पहले का समय खाली हुआ
BOOKING_EARLIER_SLOT.body={when} पर {barber} के साथ समय खाली हुआ है। आपकी बुकिंग {time} की है। बुकिंग पहले करने के लिए टैप करें; जो पहले बदलेगा, उसे मिलेगा।
BOOKING_NO_SHOW_UNDONE.title=छूटी बुकिंग हटा दी गई
BOOKING_NO_SHOW_UNDONE.body={salon} ने बताया कि {when} को आप नो-शो नहीं थे। यह आपके ख़िलाफ़ नहीं गिना जाएगा।
BOOKING_BARBER_CHANGED.title=आपका बार्बर बदल गया
BOOKING_BARBER_CHANGED.body={salon}, {when}: अब {to} के साथ। बुकिंग {booking}।
BOOKING_REMINDER.title=1 घंटे में {salon} में बुकिंग
BOOKING_REMINDER.body={time} पर {salon} में बुकिंग। स्टार्ट कोड {code}। जगह {until} तक रखी जाएगी। नहीं आ सकते? ऐप में कैंसल करें। {address}, {area}। मैप: {map}
BOOKING_RATE_VISIT.title=आपकी विज़िट कैसी रही?
BOOKING_RATE_VISIT.body={salon} में अपने {services} को रेटिंग दें। इससे दूसरों को चुनने में मदद मिलती है, और सैलून को पता चलता है कि क्या अच्छा रहा।
BOOKING_COME_BACK.title=अगले {services} का समय हो गया?
BOOKING_COME_BACK.body={salon} में आपके {services} को {ago} हो गए। कुछ ही टैप में अगली बुकिंग करें।
BOOKING_OFFER.title={salon} में {percent}% की छूट
BOOKING_OFFER.body={what} · {when}। ऐप में बुक करें।

# ---------- Bookings: to the salon ----------
SALON_NEW_BOOKING.title=नई बुकिंग, {time}
SALON_NEW_BOOKING.body={who} ने {barber} के साथ {services} बुक किया, {when}। बुकिंग {booking}।
SALON_BOOKING_MOVED.title=बुकिंग का समय बदला
SALON_BOOKING_MOVED.body={who} ने बुकिंग {booking} {from} से {to} पर कर दी, {barber} के साथ।
SALON_BOOKING_CANCELLED.title=बुकिंग कैंसल, {time}
SALON_BOOKING_CANCELLED.body={who} ने {barber} के साथ {when} की बुकिंग कैंसल की। बुकिंग {booking}।{note} यह समय फिर से खाली है।
SALON_BOOKING_CANCELLED.late=\ 1 घंटे से कम पहले।

# ---------- The shop and the field team ----------
SHOP_APPROVED.title=आपकी दुकान लाइव है
SHOP_APPROVED.body={name} मंज़ूर हो गया। आस-पास के ग्राहक अब इसे देख सकते हैं।{trial}
SHOP_APPROVED.trial=\ आपका फ़्री ट्रायल {day} तक है; उसके बाद ₹{price} महीना। अभी कुछ नहीं देना है।
SHOP_RECHECKED.title=आपके बदलाव जाँच लिए गए
SHOP_RECHECKED.body=हमारी फ़ील्ड टीम ने {name} के बदलाव जाँच लिए। अब कुछ नहीं करना है।
SHOP_NOT_APPROVED.title=आपकी दुकान में कुछ ठीक करना है

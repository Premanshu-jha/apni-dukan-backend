# ---------- Subscription ----------
SUBSCRIPTION_AUTOPAY.title=AutoPay चालू है
SUBSCRIPTION_AUTOPAY.body=हर महीने ₹{price} अपने-आप कटेंगे। आप इसे कभी भी अपने UPI ऐप में बंद कर सकते हैं।
SUBSCRIPTION_FAILED.title=पेमेंट नहीं हो पाया

# The words of the push and in-app messages (NoticeTexts), in English: exactly what the code writes (the tests fail
# on any difference), and the source of hi/te/mr/ta/kn.properties. "KEY.title" and "KEY.body" are a message; other
# keys are pieces put into them. {blanks} are filled by the code: names, numbers, codes, amounts and times as they
# are (never translated), dates with the language's day and month names. Keep every {blank} of a text in its
# translation. A value starting with a space is written "\ ..." (a properties file drops a leading space otherwise).
# UTF-8.

# ---------- Bookings: to the customer ----------
BOOKING_CONFIRMED.title=Booked at {salon}
BOOKING_CONFIRMED.body={salon}, {when}, {services}. Booking {booking}. Pay at the salon.
BOOKING_RESCHEDULED.title=Booking moved
BOOKING_RESCHEDULED.body={salon}, now {when}. Booking {booking}.
BOOKING_CANCELLED.title=Booking cancelled
BOOKING_CANCELLED.body=Your booking at {salon} on {when} is cancelled.{late}
BOOKING_CANCELLED.late=\ It was less than 1 hour before, so it counts as a late cancel.
BOOKING_CANCELLED_BY_SALON.title=Cancelled by the salon
BOOKING_CANCELLED_BY_SALON.body={salon} cancelled your booking on {when}: {reason}
BOOKING_NO_SHOW.title=Missed booking
BOOKING_NO_SHOW.body=You didn't come to {salon} at {time}. It counts as a no-show; 3 within 60 days pause online booking for 30 days.
BOOKING_EARLIER_SLOT.title=Earlier time at {salon}
BOOKING_EARLIER_SLOT.body={when} with {barber} just opened up. You're booked for {time}. Tap to move your booking; the first to move gets it.
BOOKING_NO_SHOW_UNDONE.title=Missed booking removed
BOOKING_NO_SHOW_UNDONE.body={salon} says you weren't a no-show on {when}. It doesn't count against you.
BOOKING_BARBER_CHANGED.title=Your barber changed
BOOKING_BARBER_CHANGED.body={salon}, {when}: now with {to}. Booking {booking}.
# The reminder's body must keep the order {time} (first), then {code}, then {until}: a salon's move rewrites every
# waiting reminder in one SQL statement from the parts between them (SalonNotices.reminderTexts)
BOOKING_REMINDER.title=In 1 hour at {salon}
BOOKING_REMINDER.body={time} at {salon}. Start code {code}. Held until {until}. Can't come? Cancel in the app. {address}, {area}. Map: {map}
BOOKING_RATE_VISIT.title=How was your visit?
BOOKING_RATE_VISIT.body=Rate your {services} at {salon}. It helps others choose, and tells the salon what went well.
BOOKING_COME_BACK.title=Time for your next {services}?
BOOKING_COME_BACK.body=It's been {ago} since your {services} at {salon}. Book your next visit in a few taps.
BOOKING_OFFER.title={percent}% off at {salon}
BOOKING_OFFER.body={what} · {when}. Book in the app.

# ---------- Bookings: to the salon (owner, helpers, barbers) ----------
SALON_NEW_BOOKING.title=New booking, {time}
SALON_NEW_BOOKING.body={who} booked {services} with {barber}, {when}. Booking {booking}.
SALON_BOOKING_MOVED.title=Booking moved
SALON_BOOKING_MOVED.body={who} moved booking {booking} from {from} to {to}, with {barber}.
SALON_BOOKING_CANCELLED.title=Booking cancelled, {time}
SALON_BOOKING_CANCELLED.body={who} cancelled {when} with {barber}. Booking {booking}.{note} The time is free again.
SALON_BOOKING_CANCELLED.late=\ Less than 1 hour before.
SALON_BOOKING_CANCELLED.deleted=\ They deleted their account.
SALON_BOOKING_REASSIGNED.title=Booking moved to {to}, {time}
SALON_BOOKING_REASSIGNED.body={who}, {when}: now with {to} instead of {from}.
SALON_CANCELLED_BY_SALON.title=Booking cancelled by the salon, {time}
SALON_CANCELLED_BY_SALON.body={who}, {when}: cancelled by the salon ({reason}). The time is free again.
SALON_WALK_IN_CANCELLED.title=Walk-in cancelled, {time}
SALON_WALK_IN_CANCELLED.body={guest} with {barber} at {time} was cancelled while in the chair: {reason}
SALON_WALK_IN_CANCELLED_CHAIR.title=Walk-in cancelled, {time}
SALON_WALK_IN_CANCELLED_CHAIR.body={guest} at {time} was cancelled: {reason}

# ---------- Pieces ----------
who.customer=A customer

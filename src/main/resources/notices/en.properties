cancel.salonSuspended=The salon isn't taking online bookings for now.
cancel.salonClosed=The salon has closed.
# "A, B and C": {items} is "A, B"
list.and={items} and {last}
followUp.visit=visit
ago.day=1 day
ago.days={count} days
ago.week=a week
ago.weeks={count} weeks
ago.month=a month
ago.months={count} months

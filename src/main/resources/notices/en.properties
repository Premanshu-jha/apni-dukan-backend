email.ticket.ack=We've got your request to Clozest support and created ticket {ticket}. Our support team will get back to you as soon as we can, usually within a working day.
email.ticket.yourMessage=Your message:
email.ticket.addMore=To add anything (a photo or screenshot too), just reply to this email (keep {ticket} in the subject).

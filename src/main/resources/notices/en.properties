# ---------- The shop and the field team ----------
SHOP_APPROVED.title=Your shop is live
SHOP_APPROVED.body={name} is approved. Customers nearby can find it now.{trial}
SHOP_APPROVED.trial=\ Your free trial runs until {day}; then ₹{price} a month. Nothing to pay now.
SHOP_RECHECKED.title=Your changes are checked
SHOP_RECHECKED.body=Our field team checked the changes to {name}. Nothing more to do.
SHOP_NOT_APPROVED.title=Your shop needs a change
SHOP_NOT_APPROVED.body={name} wasn't approved yet: {reason} Fix it in the app and submit again.
SHOP_FIX_ASKED.title=Please fix your change
SHOP_FIX_ASKED.body=Our field team checked the changes to {name}: {reason} Fix it in the Salon tab → Salon details (or Photos and video). Your salon stays live.
SHOP_ADDRESS_CHANGED.title=Your address is updated
SHOP_ADDRESS_CHANGED.body=Our field team changed the address of {name} to {address}. Customers see the new one now.
SHOP_ADDRESS_APPROVED.title=Your new address is approved
SHOP_ADDRESS_APPROVED.body=Our field team approved the new address of {name}: {address}. Customers see it now.
SHOP_ADDRESS_DECLINED.title=Your new address wasn't approved
SHOP_ADDRESS_DECLINED.body=Our field team didn't approve the new address of {name}: {reason} Your address stays as it was; you can ask again in the Salon tab → Salon details.
SHOP_SUSPENDED.title=Your shop is off the app
SHOP_SUSPENDED.body={name} is hidden from customers: {reason} Contact Clozest to fix this.
SHOP_REINSTATED.title=Your shop will be checked again
SHOP_REINSTATED.body={name} is no longer suspended. Our team will visit; it goes live once approved.
SHOP_DOCUMENT_REMOVED.title=Trade licence removed
SHOP_DOCUMENT_REMOVED.body=We removed the {doc} from {name}: {reason} {after}
doc.SHOPS_ESTABLISHMENT=shops and establishments certificate
doc.TRADE_LICENCE=trade licence
doc.UDYAM=udyam certificate
removed.afterApproved=Your salon stays open for bookings. Add the right one in Salon → Trade licence.
removed.afterDraft=You can add the right one in your registration, under Photos.
removed.afterOther=Nothing else changes. Add the right one in Salon → Trade licence.

# What the field team asks to fix (ReviewReason): "{list}" is the reasons picked, joined with ", "; {note} is their
# own words after a space, or nothing. OTHER is never listed (its words are the note).
review.reasons={list}.{note}
reason.SHOP_FRONT_PHOTO=the shop front photo isn't clear
reason.BOARD_NOT_VISIBLE=the name board can't be seen in the photo
reason.INSIDE_PHOTOS=photos of the inside are missing or unclear
reason.OWNER_NAME=the owner's name doesn't match
reason.LICENCE_UNREADABLE=the trade licence can't be read
reason.LICENCE_NAME_MISMATCH=the name on the trade licence doesn't match
reason.LICENCE_EXPIRED=the trade licence has expired
reason.LICENCE_WRONG_TYPE=the document isn't a trade licence for a salon
reason.ADDRESS_WRONG=the address is wrong
reason.PIN_WRONG_PLACE=the pin on the map is in the wrong place
reason.SERVICES_MISSING=services or prices are missing
reason.HOURS_MISSING=opening hours are missing
reason.VIDEO_UNCLEAR=the salon video isn't clear

# ---------- Trade licence ----------
SHOP_LICENCE_PASSED.title=Trade licence checked
SHOP_LICENCE_PASSED.body=Customers now see "Licensed" on your salon, until {day}.
SHOP_LICENCE_FAILED.title=Trade licence not accepted
SHOP_LICENCE_FAILED.body={why} Open Trade licence to see what to do.
licence.UNREADABLE=We couldn't read it: take a clear, well-lit photo of the whole licence.
licence.NOT_TRADE_LICENCE=It isn't a municipal trade licence.
licence.LOOKS_EDITED=It looks edited: upload it exactly as you got it.
licence.NO_NUMBER=We couldn't find the licence number on it.
licence.NOT_A_SALON_TRADE=It is a licence for another kind of business, not a salon.
licence.NO_VALIDITY=We couldn't find until when it is valid.
licence.EXPIRED=It has expired: add the renewed licence.
licence.NAME_MISMATCH=The name on it doesn't match your salon's name or the owner's name.
licence.ADDRESS_MISMATCH=The address on it doesn't match your salon's address.
licence.DUPLICATE=This licence is already used by another salon. If it is yours, write to support.
licence.NOT_READ=We couldn't read it: try a clearer photo, or the PDF.
licence.NOT_A_SHOP_TRADE=It is for another kind of business, not a grocery or general store.
licence.NOT_SHOPS_ESTABLISHMENT=It isn't a Shops and Establishments certificate.
SHOP_LICENCE_EXPIRED.title=Trade licence expired
SHOP_LICENCE_EXPIRED.body=Your trade licence expired on {day}, so "Licensed" on your salon is off. Upload the renewed one to get it back.
SHOP_LICENCE_EXPIRING.title=Trade licence ends soon
SHOP_LICENCE_EXPIRING.body=Your trade licence is valid until {day}. Upload the renewed one before then to keep "Licensed" on your salon.

# ---------- Subscription ----------
SUBSCRIPTION_AUTOPAY.title=AutoPay is on
SUBSCRIPTION_AUTOPAY.body=₹{price} will be paid each month by itself. You can stop it any time in your UPI app.
SUBSCRIPTION_FAILED.title=Payment didn't go through
SUBSCRIPTION_FAILED.body=This month's ₹{price} AutoPay failed. It will be tried again; check your UPI app or bank has money and the AutoPay is on.
SUBSCRIPTION_STOPPED.title=AutoPay stopped
SUBSCRIPTION_STOPPED.body=AutoPay for your salon has stopped. It stays on until {day}; open Clozest to pay and keep taking online bookings.
SUBSCRIPTION_PAID.title=Payment received
SUBSCRIPTION_PAID.body=₹{price} received for your salon. Paid up to {day}. Customers can find and book it.
SUBSCRIPTION_ENDING.title=Your {what} ends on {day}
SUBSCRIPTION_ENDING.body=Set up AutoPay ({price}) in Clozest so customers can keep booking you. Nothing is taken before {day}.
SUBSCRIPTION_ENDED.title=Your {what} has ended
SUBSCRIPTION_ENDED.body=Pay ₹{price} in Clozest by {payBy}, or customers won't find your salon from the next day.
SUBSCRIPTION_ENDED_AUTOPAY.title=Your AutoPay payment didn't go through
SUBSCRIPTION_ENDED_AUTOPAY.body=Pay ₹{price} in Clozest by {payBy}, or customers won't find your salon from the next day.
SUBSCRIPTION_HIDDEN.title=Customers can't find your salon
SUBSCRIPTION_HIDDEN.body=Your salon is hidden on Clozest and takes no new online bookings until you pay {price}. Bookings already made stay.

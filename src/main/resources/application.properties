spring.application.name=apni-dukan-backend

# Railway (and most hosts) say which port to listen on in PORT; 8080 on your laptop
server.port=${PORT:8080}

# true only on the real server: refuses to start with development settings (codes in the log, localhost CORS)
app.production=${APP_PRODUCTION:false}

# The caller's real IP (per-network limits on sign-in codes) comes from the header the proxy sets, read by
# ClientAddress: X-Forwarded-For on Railway (its last entry), CF-Connecting-IP behind Cloudflare's proxy. Empty = the
# connection's own address (your laptop). Required in production. Tomcat itself doesn't rewrite addresses.
server.forward-headers-strategy=none
app.client-ip.header=${CLIENT_IP_HEADER:}

# Load local secrets from .env (ignored by Git). On the server, the same names are environment variables.
spring.config.import=optional:file:.env[.properties]

# ---------- Database: Neon Postgres ----------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# Connections per copy of the backend. Requests, the scheduled jobs and the notification sender (its lease renewals
# and batch writes) share them. Copies × DB_POOL_SIZE must stay under the database's connection limit (Neon's
# pooled URL takes many more than its direct one).
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
# A request waits at most 10 s for a free connection, then fails (503 SERVICE_BUSY) instead of hanging
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:10000}
# Idle connections above the minimum close after 5 minutes; every connection is replaced after 30 minutes, before
# the database or a proxy drops it on its own
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=240000
# No statement of a request runs longer than DB_STATEMENT_TIMEOUT (default 5 s): Postgres stops it and the request
# answers 503 SERVICE_BUSY, instead of one slow query holding a connection (and the person) for minutes. Set on each
# connection when it opens. The background jobs allow DB_JOB_STATEMENT_TIMEOUT (60 s) inside their own transactions
# (LongStatements); Flyway uses its own connection without a limit (below), so a migration is never cut.
# On Neon's pooled URL (PgBouncer) a session setting doesn't stay with the app's connection: also run once
#   ALTER ROLE <DB_USER> SET statement_timeout = '5s';
# (see the checklist in the README).
spring.datasource.hikari.connection-init-sql=SET statement_timeout = '${DB_STATEMENT_TIMEOUT:5s}'
app.db.job-statement-timeout=${DB_JOB_STATEMENT_TIMEOUT:60s}
# A transaction open longer than this holds back the database's oldest snapshot (the day board deltas start from it,
# old rows can't be cleaned up): a WARN "A transaction has been open for ..." once a minute while it lasts
app.db.old-transaction-warn=${OLD_TRANSACTION_WARN:10m}

# Hibernate only checks tables; Flyway creates and changes them.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Keep every row's history (Envers): also store the last values when a row is deleted
spring.jpa.properties.org.hibernate.envers.store_data_at_delete=true

# A request with a field we don't know is refused (400 UNKNOWN_FIELD) instead of silently ignored.
# This also applies to anything built from Spring's RestClient.Builder. Records filled from OUTSIDE services
# (Razorpay webhooks, provider replies) must be marked @JsonIgnoreProperties(ignoreUnknown = true), or they break
# the day the provider adds a field.
spring.jackson.deserialization.fail-on-unknown-properties=true

# ---------- Flyway: uses Neon's direct (non-pooled) connection ----------
spring.flyway.url=${DB_URL_DIRECT:${DB_URL}}
spring.flyway.user=${DB_USER}
spring.flyway.password=${DB_PASSWORD}
spring.flyway.locations=classpath:db/migration
# Migrations may take long (an index on a big table): no statement limit on Flyway's own connection, whatever the
# database role's default is
spring.flyway.init-sqls=SET statement_timeout = 0
# A migration that builds indexes CONCURRENTLY runs outside a transaction; this lets its first line set lock_timeout
# (see V24 and "Database changes" in the README). Every other migration still runs in one transaction.
spring.flyway.mixed=true
# Flyway's own lock as a session lock, not an open transaction: CREATE INDEX CONCURRENTLY waits for every transaction
# that started before it, Flyway's own lock transaction included, so with a transactional lock it would never finish
spring.flyway.postgresql.transactional-lock=false
# A second copy of the backend starting while the first one is still migrating (V24 builds its indexes for minutes)
# waits for Flyway's lock instead of giving up after 50 tries and crash-looping: up to 900 tries, one a second
# (15 minutes). Deploy migrations with one copy first (see "Deploying" in the README).
spring.flyway.lock-retry-count=900

# ---------- Uploads ----------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
# Let Tomcat read (and discard) an oversized upload so the phone gets our 413 FILE_TOO_LARGE answer
# instead of a dropped connection.
server.tomcat.max-swallow-size=25MB

# ---------- Cloudflare R2 ----------
app.r2.endpoint=${R2_ENDPOINT}
app.r2.bucket=${R2_BUCKET}
app.r2.access-key=${R2_ACCESS_KEY}
app.r2.secret-key=${R2_SECRET_KEY}
# R2 always uses "auto"; tests against MinIO use us-east-1
app.r2.region=${R2_REGION:auto}
# A hung R2 must not hold a request (and its thread) for minutes: each try of a call gets R2_ATTEMPT_TIMEOUT, the
# whole call with the library's retries R2_CALL_TIMEOUT. Uploads (up to 10 MB) get their own, longer limit:
# R2_UPLOAD_TIMEOUT per try, twice that in all
app.r2.attempt-timeout=${R2_ATTEMPT_TIMEOUT:5s}
app.r2.call-timeout=${R2_CALL_TIMEOUT:15s}
app.r2.upload-timeout=${R2_UPLOAD_TIMEOUT:60s}
app.files.link-minutes=5
# Photo links in lists: signed this long, and the same link given again while 15 minutes are left (FileRefService)
app.files.photo-link-minutes=${PHOTO_LINK_MINUTES:60}
# Photos cleaned at once per server (each takes up to about 30 MB while it is drawn again); more wait their turn
app.files.photo-cleaning-at-once=${PHOTO_CLEANING_AT_ONCE:4}

# ---------- Redis Cloud (OTP and email codes, rate limits) ----------
spring.data.redis.url=${REDIS_URL}
# Give up on Redis quickly: a hung Redis must not hold every request for a minute (the default). Signed-in calls
# then carry on without it; sign-in codes and start codes answer 503 SERVICE_BUSY until it is back.
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=1s

# ---------- Sign-in tokens (JWT) ----------
# A long random secret, at least 32 characters (e.g. from: openssl rand -base64 48). Never commit it.
app.jwt.secret=${JWT_SECRET}
app.jwt.access-minutes=15
app.jwt.refresh-days=30

# ---------- SMS (OTP) ----------
# MSG91 Flow API, same account and OTP template as the OMR project (until Apni Dukan's own DLT registration).
# SMS_PROVIDER=log prints codes in the console instead (only if you choose it; refused in production).
app.sms.provider=${SMS_PROVIDER:msg91}
app.sms.msg91.auth-key=${MSG91_AUTH_KEY:}
app.sms.msg91.otp-template-id=${MSG91_OTP_TEMPLATE_ID:}
# "Your account was moved to a new number ending ##ENDING##" (sent to the old phone after account recovery).
# Off until its DLT template exists; when on, the template ID is required. Must be on in production.
app.sms.account-moved.enabled=${SMS_ACCOUNT_MOVED_ENABLED:false}
app.sms.msg91.account-moved-template-id=${MSG91_ACCOUNT_MOVED_TEMPLATE_ID:}
# The SMS budget for codes (SmsBudget): at most this many per day in total (raise it as sign-ins grow), and at most
# SMS_HOURLY_LIMIT in one hour. From 80% of the day's budget, or past the hour's cap, only people who signed in within
# 30 days get codes (new numbers: 503 SMS_PAUSED); at 100% everyone stops. Alerts: a WARN "80% of the daily SMS limit
# used" once a day, an ERROR "SMS for new numbers paused" once an hour, an ERROR "Daily SMS limit ... reached".
app.sms.daily-limit=${SMS_DAILY_LIMIT:50000}
app.sms.hourly-limit=${SMS_HOURLY_LIMIT:10000}
# Per network, per hour: codes requested (SMS or email) and codes tried. Mobile operators put thousands of phones
# behind one IPv4 address, so it gets a high limit; an IPv6 caller is counted per /64 (one phone or home), so a low
# one. The per-phone limits (3 codes per 10 minutes, 10 a day...) are separate and protect each account.
app.auth.ip-sends-per-hour=${IP_SENDS_PER_HOUR:200}
app.auth.ipv6-sends-per-hour=${IPV6_SENDS_PER_HOUR:20}
app.auth.ip-verifies-per-hour=${IP_VERIFIES_PER_HOUR:600}
app.auth.ipv6-verifies-per-hour=${IPV6_VERIFIES_PER_HOUR:60}
# Cloudflare Turnstile ("not a robot") before sign-in and recovery codes: the widget's secret key. Empty = no check
# (your laptop); required in production. The app sends the widget's token as captchaToken.
app.captcha.turnstile-secret=${TURNSTILE_SECRET_KEY:}

# ---------- Email (verification and recovery codes) ----------
# Resend (resend.com) once RESEND_API_KEY is set: one HTTPS call per email, sent from EMAIL_FROM (an address on a
# domain verified in Resend; onboarding@resend.dev only reaches your own Resend account, refused in production).
app.email.resend-api-key=${RESEND_API_KEY:}
app.email.from=${EMAIL_FROM:Clozest <onboarding@resend.dev>}
# Without RESEND_API_KEY: Gmail SMTP, same as Vidyavriti: MAIL_USERNAME = the Gmail address, MAIL_PASSWORD = its
# 16-letter app password.
# MAIL_ENABLED=false prints emails in the console instead (only if you choose it; refused in production).
app.mail.enabled=${MAIL_ENABLED:true}
# Empty = send from MAIL_USERNAME (Gmail requires that)
app.mail.from=${MAIL_FROM:}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# Don't let a slow mail server hang the request
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ---------- Address search at registration ("Find my salon on the map") ----------
# A Google Maps Platform key restricted to the Geocoding API (Google Cloud project "clozest"). Optional: without it
# POST /shops/geocode answers 503 GEOCODING_OFF and the partner app hides the button (GPS still works).
app.geocoding.google-key=${GOOGLE_GEOCODING_KEY:}
# Empty = Google's real endpoint; tests point it at a local fake
app.geocoding.google-url=

# ---------- CORS: which web addresses may call this API from a browser ----------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Background jobs (sending notifications, ending appointments at their planned end, nightly cleanup). Tests turn
# them off and run them by hand. Several scheduler threads, so a long notification round or cleanup can't delay the
# automatic end. Each job's round runs on one copy of the backend at a time (JobLeases), except the notification
# sender, which every copy runs (each claims different messages).
app.jobs.enabled=${JOBS_ENABLED:true}
spring.task.scheduling.pool.size=${SCHEDULER_THREADS:4}
# Nightly cleanup deletes this many rows per statement (each its own short transaction)
app.cleanup.batch=10000
# Ended sign-ins (expired, signed out, swapped) are deleted 30 days after they ended. Swapped (rotated) tokens must
# stay that long: one coming back is how a copied token is caught (see SignInCleanupJob)
app.auth.ended-sign-ins-keep-days=30
# A swapped refresh token coming back within this many seconds, while the token it was swapped for was never used,
# gets a new pair (the app reloaded mid-refresh) instead of counting as copied. 0 = no grace.
app.auth.refresh-grace-seconds=${REFRESH_GRACE_SECONDS:30}

# Small jobs run after the reply (notice emails, the account-moved SMS): threads, and how many may wait (more are
# dropped with a warning). Kept in memory only.
app.background.threads=4
app.background.queue=1000

# Health check for Railway (Settings → Deploy → Healthcheck Path: /actuator/health). Only UP/DOWN, no details, and
# no other actuator endpoint. Redis isn't part of it: the app keeps serving while Redis is down (see SessionRevocations).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.health.redis.enabled=false
management.health.mail.enabled=false

# Web Push (browser notifications). Generate the pair once (npx web-push generate-vapid-keys) and keep it: a new
# pair makes every saved device stop receiving messages. Empty = messages are only logged (refused in production).
app.push.vapid-public-key=${VAPID_PUBLIC_KEY:}
app.push.vapid-private-key=${VAPID_PRIVATE_KEY:}
app.push.subject=${VAPID_SUBJECT:mailto:support@apnidukan.in}

# Booking messages as SMS too: set a type's MSG91 template id (DLT-approved) and it is used from then on; empty = no
# SMS for that type. Variables each template must use are listed in the README ("Messages").
# At most this many booking SMS per day in total (separate from SMS_DAILY_LIMIT for sign-in codes), and 10 per person.
# At 80% a WARN "80% of the daily booking-SMS limit used" is logged once a day.
app.sms.booking-daily-limit=${SMS_BOOKING_DAILY_LIMIT:100000}
# Per day, per salon owner or barber, for the partner messages (one per booking): a busy salon gets hundreds.
# Customers keep 10 a day each.
app.sms.staff-per-person-daily-limit=${SMS_STAFF_PER_PERSON_DAILY_LIMIT:1000}
app.sms.template.booking-confirmed=${SMS_TEMPLATE_BOOKING_CONFIRMED:}
app.sms.template.booking-reminder=${SMS_TEMPLATE_BOOKING_REMINDER:}
app.sms.template.booking-rescheduled=${SMS_TEMPLATE_BOOKING_RESCHEDULED:}
app.sms.template.booking-cancelled=${SMS_TEMPLATE_BOOKING_CANCELLED:}
app.sms.template.booking-cancelled-by-salon=${SMS_TEMPLATE_BOOKING_CANCELLED_BY_SALON:}
app.sms.template.booking-no-show=${SMS_TEMPLATE_BOOKING_NO_SHOW:}
# To the salon (owner, and the barber with a sign-in) when a customer books, cancels or moves online
app.sms.template.salon-new-booking=${SMS_TEMPLATE_SALON_NEW_BOOKING:}
app.sms.template.salon-booking-cancelled=${SMS_TEMPLATE_SALON_BOOKING_CANCELLED:}
app.sms.template.salon-booking-moved=${SMS_TEMPLATE_SALON_BOOKING_MOVED:}

# ---------- Sending notifications (NotificationSendJob) ----------
# Every NOTIFY_SEND_DELAY_MS after the last round ends, a round claims NOTIFY_BATCH_SIZE due messages at a time and
# keeps claiming while batches come back full; each batch is sent NOTIFY_SEND_CONCURRENCY at a time on virtual threads,
# at most NOTIFY_PER_HOST_CONCURRENCY at once to one push service or to MSG91. Sends don't use the database: leases are
# renewed a group at a time and outcomes written NOTIFY_RECORD_EVERY per statement (at least every 0.25 s), so the
# sender needs at most two connections whatever the concurrency.
# A batch claims no more than fits in 80% of the batch deadline at the expected time per message; messages not
# started by the deadline are given back untried.
app.notifications.send-delay-ms=${NOTIFY_SEND_DELAY_MS:2000}
app.notifications.batch-size=${NOTIFY_BATCH_SIZE:500}
app.notifications.send-concurrency=${NOTIFY_SEND_CONCURRENCY:64}
app.notifications.per-host-concurrency=${NOTIFY_PER_HOST_CONCURRENCY:32}
app.notifications.record-every=${NOTIFY_RECORD_EVERY:50}
app.notifications.batch-deadline-ms=180000
app.notifications.expected-send-ms=1000
# Finished messages are deleted after this many days; SMS rows (never shown in the app's list) sooner
app.notifications.keep-days=90
app.notifications.sms-keep-days=${SMS_MESSAGES_KEEP_DAYS:7}

# ---------- Salon pages for customers ----------
# A salon's page, its services and its free times, per signed-in person per minute (then 429 TOO_MANY_REQUESTS with
# Retry-After): each free-time check reads every barber's day
app.salon.reads-per-minute=${SALON_READS_PER_MINUTE:60}
# Salons' setups (barbers, hours, services) each server keeps in memory for free-time checks, the most recently used
# ones; an entry is used only while the salon's setup is unchanged (salon_versions.setup_version). Bounded by size:
# an entry weighs 1 + its barbers, their services and hour blocks, and the salon's services (2,000,000 ≈ 50,000
# typical salons, about 100 MB)
app.salon.setup-cache-weight=${SALON_SETUP_CACHE_WEIGHT:2000000}
# Rows of salons' busy time per day each server keeps in memory for free-time checks, used only while the salon's
# change counter is unchanged (salon_versions.version): about 100 bytes a row
app.salon.busy-cache-rows=${SALON_BUSY_CACHE_ROWS:500000}
# The owner also gets an SMS for each booking, move and cancel (barbers keep theirs when the template is set). Off:
# the owner is told by push and in the app's list; a busy salon would otherwise cost an SMS per booking.
app.notifications.owner-booking-sms=${OWNER_BOOKING_SMS:false}
# Bookings of a closed salon cancelled per slice (SalonClosingJob, every 10 s; each slice its own transaction)
app.jobs.salon-closing-batch=500

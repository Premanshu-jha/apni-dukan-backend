# Automatic checks that GitHub runs on every push and pull request.
# You never run or edit this file yourself; it just shows a green tick or red cross on GitHub.

name: CI                       # the name shown on GitHub's "Actions" tab

on:                            # WHEN to run:
  push:
    branches: [main]           #   when something lands on main
  pull_request:                #   and on every pull request

# Actions are pinned to exact commits (the version is in the comment), so nobody can swap the code behind a tag.
# Dependabot still proposes updates for them.

permissions:                   # what this workflow's GitHub token may do: read only, nothing else
  contents: read
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest     # GitHub lends a fresh Linux machine for each run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 · 1. download this repository's code
        with:
          fetch-depth: 0                   #    (with full history, so the secret scan can check every commit)
          persist-credentials: false       #    don't leave the GitHub token on disk for the build to read

      - name: Check for committed secrets  # 2. fail if a password or API key was committed by mistake
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0 · 3. install Java 21
        with:
          distribution: temurin
          java-version: '21'
          cache: maven                     #    and reuse downloaded libraries between runs (faster)

      - name: Build, test and check code   # 4. compile (with Error Prone), run all tests, then coverage, SpotBugs
        run: mvn -B verify -Perrorprone 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Test summary                 # 5. list how many tests ran, failed or were skipped
        if: always()
        run: |
          for f in target/surefire-reports/*.txt; do
            echo "::notice title=$(basename "$f" .txt)::$(grep -m1 'Tests run' "$f")"
          done

      - name: Coverage summary             # 6. how much of the code the tests actually run
        if: always()
        run: |
          f=target/site/jacoco/jacoco.csv
          [ -f "$f" ] || exit 0
          # jacoco.csv columns: GROUP,PACKAGE,CLASS,INSTRUCTION_MISSED,INSTRUCTION_COVERED,BRANCH_MISSED,BRANCH_COVERED,LINE_MISSED,LINE_COVERED,...
          awk -F, 'function pct(c, m) { return (c + m) == 0 ? 100 : 100 * c / (c + m) }
            NR>1 { lm+=$8; lc+=$9; bm+=$6; bc+=$7; split($2,p,"."); m=(p[3]=="" ? "(root)" : p[3]); mlm[m]+=$8; mlc[m]+=$9 }
            END {
              printf "::notice title=Coverage::lines %.1f%%, branches %.1f%%\n", pct(lc,lm), pct(bc,bm)
              print "## Test coverage" >> ENVIRON["GITHUB_STEP_SUMMARY"]
              printf "Lines **%.1f%%** · branches **%.1f%%**\n\n| Module | Lines |\n| --- | --- |\n", pct(lc,lm), pct(bc,bm) >> ENVIRON["GITHUB_STEP_SUMMARY"]
              for (m in mlc) printf "| %s | %.1f%% |\n", m, pct(mlc[m],mlm[m]) >> ENVIRON["GITHUB_STEP_SUMMARY"]
            }' "$f"

      - name: Show why it failed           # 7. only if step 4 failed: put the key error lines on the GitHub page
        if: failure()
        run: |
          grep -E "\[ERROR\]|Caused by|Exception|expected|but was" build.log | head -60 | sed 's/%/%25/g' > errors.txt || true
          echo "::error title=Build or test failure::$(sed ':a;N;$!ba;s/\n/%0A/g' errors.txt)"
          for f in target/surefire-reports/*.txt; do
            if grep -qE "FAILURE|ERROR" "$f"; then
              echo "::error title=$(basename "$f")::$(head -40 "$f" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            fi
          done

  # Security scan of the source code (free Semgrep rules: Java, secrets, OWASP Top 10). Separate job, runs in parallel.
  # Semgrep is installed from PyPI at the exact version in .github/semgrep/requirements.txt (Dependabot proposes
  # updates), instead of an unpinned Docker image that anyone controlling the tag could swap.
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - name: Install Semgrep
        run: pip install --disable-pip-version-check -r .github/semgrep/requirements.txt
      - name: Scan for security problems
        run: |
          semgrep scan --metrics=off --error --json --output semgrep.json \
            --config p/java --config p/secrets --config p/owasp-top-ten --exclude src/test && rc=0 || rc=$?
          # Put each finding next to its line on the pull request page, and show scan errors (files Semgrep
          # couldn't read are not scanned, so they must not pass silently)
          py=0
          python3 - <<'PY' || py=$?
          import json, sys

          def esc(value, prop=False):
              value = str(value).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              return value.replace(":", "%3A").replace(",", "%2C") if prop else value

          try:
              report = json.load(open("semgrep.json"))
          except (OSError, ValueError) as e:
              print("::error title=Semgrep::Semgrep produced no report (%s); see the log above" % esc(e))
              sys.exit(0)
          for r in report.get("results", []):
              rule = r["check_id"].split(".")[-1]
              print("::error file=%s,line=%s,title=%s::%s" % (esc(r["path"], True), r["start"]["line"],
                    esc("Semgrep " + rule, True), esc(r["extra"]["message"][:400])))
          errors = report.get("errors", [])
          for e in errors:
              print("::error title=Semgrep scan error::%s" % esc(e.get("message", e)[:400] if isinstance(e.get("message"), str) else e))
          sys.exit(1 if errors else 0)
          PY
          if [ $rc -ne 0 ]; then exit $rc; fi
          exit $py

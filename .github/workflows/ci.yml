# Automatic checks that GitHub runs on every push and pull request.
# You never run or edit this file yourself; it just shows a green tick or red cross on GitHub.

name: CI                       # the name shown on GitHub's "Actions" tab

on:                            # WHEN to run:
  push:
    branches: [main]           #   when something lands on main
  pull_request:                #   and on every pull request

jobs:
  build:
    runs-on: ubuntu-latest     # GitHub lends a fresh Linux machine for each run
    steps:
      - uses: actions/checkout@v4          # 1. download this repository's code
        with:
          fetch-depth: 0                   #    (with full history, so the secret scan can check every commit)

      - name: Check for committed secrets  # 2. fail if a password or API key was committed by mistake
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4        # 3. install Java 21
        with:
          distribution: temurin
          java-version: '21'
          cache: maven                     #    and reuse downloaded libraries between runs (faster)

      - name: Build and run tests          # 4. compile everything and run all tests
        run: mvn -B verify                 #    same as running "mvn verify" on your laptop
